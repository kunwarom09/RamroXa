services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: zylo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zylo_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zylo-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/zylo_db
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: zylo-production-jwt-access-secret-key-32-chars-minimum!
      JWT_REFRESH_SECRET: zylo-production-jwt-refresh-secret-key-32-chars-minimum!
      COOKIE_DOMAIN: localhost
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: zylo-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
