name: Zylo CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Integration & Unit Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/zylo_test
          JWT_ACCESS_SECRET: zylo_super_secret_jwt_access_key_test_123456
          JWT_REFRESH_SECRET: zylo_super_secret_jwt_refresh_key_test_123456
          RATE_LIMIT_WINDOW_MS: 900000
          RATE_LIMIT_MAX: 1000
        run: npm test

      - name: Audit Production Dependencies
        working-directory: ./server
        run: npm audit --omit=dev

  frontend-build:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./client
        run: npm run build
